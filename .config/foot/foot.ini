[main]
pad = 6x6
# font=Iosevka Nerd Font Mono:size=14
font=Iosevka Nerd Font Mono:size=8
# font=creep2:size=9
# font=monospace:size=8
# font=CozetteVector:size=9
# font=Scientifica:size=10
# font=Terminus (TTF):size=9
